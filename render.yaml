services:
  - type: web
    name: apm-contratos
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apm-contratos-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@apartamentosmanaus.com.br
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador APM
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: apm-contratos-db
    plan: starter
